<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Buttons</title>
</head>
<body>
    <div>
        <button id ="orange">
            ORANGE
        </button>
        <button id="green">
            GREEN
        </button>
    </div>
    
</body>
<script>
    function clickHandler(color){
        return function(){
            document.body.style.backgroundColor = `${color}`
        }
    }
    const but = document.querySelectorAll('button')
    console.log(but)
    but.forEach(btn =>{
        btn.onclick = clickHandler(btn.id)
   })
</script>
</html>
